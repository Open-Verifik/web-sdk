<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm animate-fadeIn">
	<div class="relative w-full max-w-md mx-4 bg-white rounded-2xl shadow-2xl animate-slideUp">
		<!-- Success Icon -->
		<div class="flex justify-center pt-8 pb-4">
			<div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center animate-scaleIn">
				<mat-icon class="text-green-600 !text-5xl !w-12 !h-12">check_circle</mat-icon>
			</div>
		</div>

		<!-- Content -->
		<div class="px-8 pb-8 text-center">
			<!-- Title -->
			<h2 class="text-2xl font-bold text-gray-900 mb-3">
				{{ title || ("add_biometrics.passkey_success.title" | transloco) }}
			</h2>

			<!-- Description -->
			<p class="text-gray-600 mb-6 leading-relaxed">
				{{ description || ("add_biometrics.passkey_success.description" | transloco) }}
			</p>

			<!-- Continue Button -->
			<button
				mat-flat-button
				(click)="onContinue()"
				class="w-full !bg-gradient-to-r !from-blue-600 !to-blue-700 !text-white !py-3 !rounded-xl !font-semibold !shadow-lg hover:!shadow-xl !transition-all !duration-200 hover:!scale-[1.02]"
			>
				{{ buttonText || ("add_biometrics.passkey_success.continue" | transloco) }}
			</button>
		</div>
	</div>
</div>
