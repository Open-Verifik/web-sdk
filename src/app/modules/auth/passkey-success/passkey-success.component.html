<div class="passkey-overlay fixed inset-0 z-[10000] flex items-center justify-center px-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
	<div
		class="relative z-10 w-full max-w-sm overflow-hidden rounded-3xl bg-white dark:bg-gray-900 shadow-2xl ring-1 ring-slate-200/70 dark:ring-gray-800 animate-slideUp"
	>
		<!-- Success Icon -->
		<div class="flex justify-center pt-8 pb-4">
			<div
				class="flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-emerald-50 to-green-100 dark:from-emerald-900/40 dark:to-green-900/30 ring-1 ring-emerald-100 dark:ring-emerald-900/50 animate-scaleIn"
			>
				<mat-icon class="text-emerald-600 dark:text-emerald-400 !text-5xl !w-12 !h-12">check_circle</mat-icon>
			</div>
		</div>

		<!-- Content -->
		<div class="px-8 pb-8 text-center">
			<h2 class="text-2xl font-bold text-slate-900 dark:text-gray-50 mb-2">
				{{ title || ("add_biometrics.passkey_success.title" | transloco) }}
			</h2>

			<p class="text-sm text-slate-500 dark:text-gray-400 mb-6 leading-relaxed">
				{{ description || ("add_biometrics.passkey_success.description" | transloco) }}
			</p>

			<button
				mat-flat-button
				(click)="onContinue()"
				class="passkey-success__continue w-full !rounded-xl !h-12 !text-base !font-semibold"
			>
				{{ buttonText || ("add_biometrics.passkey_success.continue" | transloco) }}
			</button>
		</div>
	</div>
</div>
