<div class="h-full w-full bg-card overflow-hidden relative flex flex-col items-center">
	<!-- Close Button -->
	<button mat-icon-button (click)="closeDialog()" class="absolute top-2 right-2 z-50">
		<mat-icon>close</mat-icon>
	</button>

	<canvas #credentialCanvas hidden="true" *ngIf="!showError"></canvas>

	<div
		*ngIf="!showError"
		fxLayout="column"
		fxLayoutAlign="center center"
		class="p-4 sm:p-1 xs:p-1 w-full flex-grow flex flex-col justify-center items-center"
	>
		<div
			fxLayout="column"
			fxLayoutAlign="center center"
			class="w-full flex flex-col items-center justify-center"
			*ngIf="!loadingModel && !lowCamera"
		>
			<div
				fxLayout="column"
				fxLayoutAlign="center center"
				class="text-center h-20 sm:h-8 xs:h-8 my-2 flex flex-col items-center justify-center"
			>
				<div *ngIf="errorFace && !loadingResults" class="mb-4">
					<div [style.color]="project ? project.branding.titleColor : null" class="text-3xl font-bold">{{ errorFace.title }}</div>
					<div [style.color]="project ? project.branding.textColor : null" class="text-gray-600">{{ errorFace.subtitle }}</div>
				</div>

				<div *ngIf="loadingResults" class="mb-4 flex flex-col items-center">
					<div [style.color]="project ? project.branding.titleColor : null" class="text-3xl font-bold mb-2">
						{{ "liveness.processing" | transloco }}
					</div>
					<mat-progress-bar mode="indeterminate" class="w-64"></mat-progress-bar>
				</div>
			</div>

			<div class="relative" [style.width.px]="WIDTH" [style.height.px]="HEIGHT">
				<video
					#video
					autoplay
					class="absolute top-0 left-0 oval-video"
					[style.maxWidth.px]="maxWidth"
					[style.maxHeight.px]="maxHeight"
					[class.hidden]="base64Image"
				></video>

				<div
					#canvas
					class="absolute top-0 left-0 oval-video"
					[style.width.px]="WIDTH"
					[style.height.px]="HEIGHT"
					[class.hidden]="base64Image"
				></div>

				<canvas #result class="absolute" [class.hidden]="!base64Image"></canvas>
				<canvas #toSend class="absolute" [class.hidden]="true"></canvas>
			</div>
		</div>

		<div *ngIf="loadingModel" class="flex flex-col items-center justify-center h-full w-full">
			<mat-spinner [diameter]="64"></mat-spinner>
			<p class="mt-4 text-lg font-medium text-secondary">{{ "liveness.loading_stream" | transloco }}</p>
		</div>

		<div
			fxLayout="column"
			fxLayoutAlign="center center"
			class="id-scanning-error-div flex flex-col items-center justify-center"
			*ngIf="!loadingModel && lowCamera"
		>
			<img src="https://cdn.verifik.co/demo/nocameraenabled.svg" alt="" class="id-scanning-no-camera-enabled-img" />

			<h1 class="mt-4" [style.color]="project.branding.titleColor">{{ "id_scanning.camera_not_found" | transloco }}</h1>

			<p class="mt-4" [style.color]="project.branding.textColor">
				{{ "id_scanning.camera_not_found_description" | transloco }}
			</p>
		</div>
	</div>

	<auth-biometric-errors-display
		*ngIf="showError && errorContent"
		[errorContent]="errorContent"
		[project]="project"
		[projectFlow]="projectFlow"
		[callback]="retry"
		[appLoginToken]="appLoginToken"
		class="w-full h-full"
	></auth-biometric-errors-display>
</div>
